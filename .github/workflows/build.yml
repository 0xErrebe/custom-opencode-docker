name: build

on:
  schedule:
    # Every 6 hours. GitHub disables scheduled workflows after 60 days without
    # repository activity (public repos), which is the accepted staleness window.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test the version selector
        run: bash .github/scripts/latest-version.test.sh

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name (owner lowercased for ghcr)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opencode-sandbox" >> "$GITHUB_ENV"

      - name: Resolve latest opencode 2.x.x base tag
        id: version
        run: |
          set -euo pipefail
          token=$(curl -fsSL "https://ghcr.io/token?scope=repository:anomalyco/opencode:pull&service=ghcr.io" | jq -r .token)
          url="https://ghcr.io/v2/anomalyco/opencode/tags/list?n=1000"
          : > /tmp/tags.ndjson
          while [ -n "$url" ]; do
            hdr=$(mktemp)
            curl -fsSL -D "$hdr" -H "Authorization: Bearer $token" "$url" | jq -r '.tags[]?' >> /tmp/tags.ndjson
            link=$(grep -i '^link:' "$hdr" | tr -d '\r' || true)
            if printf '%s' "$link" | grep -q 'last='; then
              last=$(printf '%s' "$link" | sed -E 's/.*last=([^&>]+).*/\1/')
              url="https://ghcr.io/v2/anomalyco/opencode/tags/list?n=1000&last=${last}"
            else
              url=""
            fi
          done
          jq -Rn '[inputs] | {tags: .}' /tmp/tags.ndjson > /tmp/tags.json
          version=$(bash .github/scripts/latest-version.sh /tmp/tags.json)
          echo "latest 2.x.x base tag: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Warn when a new major (3.x+) appears and is not already tracked.
          major=$(jq -r '.tags[]' /tmp/tags.json | grep -E '^[3-9]\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if this version is already published
        id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:${{ steps.version.outputs.version }} already published, skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            OPENCODE_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest

      - name: Verify the image is anonymously pullable
        if: steps.exists.outputs.exists == 'false'
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          acc="application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json"
          tok=$(curl -sSL "https://ghcr.io/token?scope=repository:${owner}/opencode-sandbox:pull&service=ghcr.io" | jq -r '.token // empty')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${tok}" -H "Accept: ${acc}" \
            "https://ghcr.io/v2/${owner}/opencode-sandbox/manifests/latest")
          if [ "$code" != "200" ]; then
            echo "::error::Image pushed but not anonymously pullable (HTTP $code). Set the package to public: repo -> Packages -> opencode-sandbox -> Package settings -> Change visibility -> Public."
            exit 1
          fi
          echo "Anonymously pullable: OK"

      - name: Open issue if a new opencode major was released
        if: steps.version.outputs.major != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          set -euo pipefail
          title="opencode ${MAJOR%%.*}.x released"
          if gh issue list --state open --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Issue already open: $title"
          else
            gh issue create --title "$title" \
              --body "A new opencode major ($MAJOR) was published. The auto-rebuild workflow only tracks 2.x.x. Review whether the Dockerfile should move to this major."
          fi
